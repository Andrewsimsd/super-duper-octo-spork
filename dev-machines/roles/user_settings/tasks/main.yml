---
- name: Set system hostname to inventory name (for mDNS .local)
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  notify: Restart avahi-daemon

- name: Ensure default shell aliases are set system-wide
  ansible.builtin.copy:
    dest: /etc/profile.d/aliases.sh
    content: |
      alias ls='ls --color=auto'
    owner: root
    group: root
    mode: "0644"

- name: Enforce 15-minute shell inactivity logout
  ansible.builtin.copy:
    dest: /etc/profile.d/idle-timeout.sh
    content: |
      TMOUT=900
      readonly TMOUT
      export TMOUT
    owner: root
    group: root
    mode: "0644"

- name: Ensure dconf local database directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure system dconf profile includes local database
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
    owner: root
    group: root
    mode: "0644"
  notify: Update dconf database

- name: Ensure GNOME default dark mode is set
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/00-gnome-settings
    content: |
      [org/gnome/desktop/interface]
      color-scheme='prefer-dark'
    owner: root
    group: root
    mode: "0644"
  notify: Update dconf database

- name: Apply GNOME dark mode for login user
  ansible.builtin.shell: |
    set -e
    dbus-run-session -- gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Ensure Firefox policies directory exists
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Firefox bookmark for router page
  ansible.builtin.copy:
    dest: /etc/firefox/policies/policies.json
    content: |
      {
        "policies": {
          "ManagedBookmarks": [
            {
              "toplevel_name": "Managed Bookmarks"
            },
            {
              "name": "Router",
              "url": "http://192.168.1.1",
              "placement": "toolbar"
            }
          ]
        }
      }
    owner: root
    group: root
    mode: "0644"
