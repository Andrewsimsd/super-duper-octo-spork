---
- name: Install Vivado and petalinux installer dependencies
  ansible.builtin.apt:
    name:
      # Required for Vivado install
      - libtinfo5
      - libncurses5-dev
      # Required for Petalinux install
      - gawk
      - xterm
      - autoconf
      - libtool
      - texinfo
      - gcc-multilib
    state: present
    update_cache: true

- name: Ensure Vivado repositories directory exists
  ansible.builtin.file:
    path: "{{ repos_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
  become: true

- name: Clone Digilent Vivado boards repository
  ansible.builtin.git:
    repo: "{{ vivado_boards_repo }}"
    dest: "{{ vivado_boards_dest }}"
    version: master
  register: vivado_boards_clone
  retries: 3
  delay: 10
  until: vivado_boards_clone is succeeded
  failed_when: false
  become: true
  become_user: "{{ dev_user }}"

- name: Warn when Vivado boards repository could not be cloned
  when: vivado_boards_clone is failed
  ansible.builtin.debug:
    msg: >
      Failed to clone {{ vivado_boards_repo }}.
      Check network access and rerun this play if you need board files installed.

- name: Ensure Vivado boards data directory exists
  become: true
  ansible.builtin.file:
    path: "{{ vivado_tools_dir }}/data/boards"
    state: directory
    mode: "0755"

- name: Check for Vivado board files directory
  become: true
  ansible.builtin.stat:
    path: "{{ vivado_boards_source_dir }}"
  register: vivado_board_files

- name: Copy Vivado board files into Xilinx data directory
  when:
    - vivado_boards_clone is succeeded
    - vivado_board_files.stat.exists
  become: true
  ansible.builtin.copy:
    src: "{{ vivado_boards_source_dir }}"
    dest: "{{ vivado_tools_dir }}/data/boards"
    remote_src: true

- name: Ensure /tools is owned by the login user
  become: true
  ansible.builtin.file:
    path: /tools
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    recurse: true

- name: Ensure Vivado role sets default shell to bash
  become: true
  ansible.builtin.user:
    name: "{{ dev_user }}"
    shell: /bin/bash
