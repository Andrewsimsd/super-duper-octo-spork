---
- name: Install Rust system dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - pkg-config
      - libssl-dev
      - curl
      - ca-certificates
    state: present
    update_cache: true

- name: Install Python tooling
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

# (Optional) clean up a common failure mode where rustup got installed as root
- name: Remove accidental root rustup install (optional)
  # Rust tooling should be installed per-user; this avoids root-owned toolchains.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.cargo
    - /root/.rustup

- name: Install rustup (and thus cargo) for the login user
  ansible.builtin.shell: |
    set -e
    curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile default
  args:
    executable: /bin/bash
    creates: "{{ rustup_bin }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Install stable toolchain + set default
  ansible.builtin.shell: |
    set -e
    {{ rustup_bin }} toolchain install stable
    {{ rustup_bin }} default stable
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Add clippy and rustfmt components
  ansible.builtin.shell: |
    set -e
    {{ rustup_bin }} component add clippy rustfmt
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Ensure cargo is on PATH for bash (interactive shells)
  # Adds cargo to PATH in interactive shells for CLI usage.
  ansible.builtin.lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'export PATH="$HOME/.cargo/bin:$PATH"'
    create: true
    state: present
  become: true
  become_user: "{{ dev_user }}"

- name: Ensure user environment.d directory exists (for GUI PATH)
  # Systemd environment.d is used for GUI apps launched from desktop sessions.
  ansible.builtin.file:
    path: "{{ dev_home }}/.config/environment.d"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ dev_user }}"

- name: Ensure cargo is on PATH for GUI apps too (VS Code launched from desktop)
  # Ensures GUI apps like VS Code can find cargo without a login shell.
  ansible.builtin.copy:
    dest: "{{ dev_home }}/.config/environment.d/10-cargo.conf"
    content: |
      PATH=$HOME/.cargo/bin:$PATH
    mode: "0644"
  become: true
  become_user: "{{ dev_user }}"

- name: Install cargo-deny
  ansible.builtin.shell: |
    set -e
    {{ cargo_bin }} install --locked cargo-deny
  args:
    executable: /bin/bash
    creates: "{{ cargo_home }}/bin/cargo-deny"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Install cargo-audit
  ansible.builtin.shell: |
    set -e
    {{ cargo_bin }} install --locked cargo-audit
  args:
    executable: /bin/bash
    creates: "{{ cargo_home }}/bin/cargo-audit"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Install cargo-nextest
  ansible.builtin.shell: |
    set -e
    {{ cargo_bin }} install --locked cargo-nextest
  args:
    executable: /bin/bash
    creates: "{{ cargo_home }}/bin/cargo-nextest"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Install cargo-crev
  ansible.builtin.shell: |
    set -e
    {{ cargo_bin }} install --locked cargo-crev
  args:
    executable: /bin/bash
    creates: "{{ cargo_home }}/bin/cargo-crev"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Install embedded/cross development packages (ARMv7hf)
  ansible.builtin.apt:
    name:
      # Cross compiler toolchain (glibc Linux target)
      - gcc-arm-linux-gnueabihf
      - g++-arm-linux-gnueabihf

      # Debugging & binary inspection
      - gdb
      - gdb-multiarch
      - binutils-arm-linux-gnueabihf

      # Build system + speedups
      - cmake
      - ninja-build
      - ccache
      - pkg-config

      # Helpful runtime/diagnostics tools
      - rsync
      - openssh-client
      - curl
      - ca-certificates
      - file
      - jq
      - strace
      - ltrace

      # Serial console / embedded bring-up
      - picocom

      # Optional but often useful for embedded Linux work
      - device-tree-compiler
    state: present
    update_cache: true

- name: Add Rust ARMv7hf target
  ansible.builtin.shell: |
    set -e
    {{ rustup_bin }} target add armv7-unknown-linux-gnueabihf
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_home }}"
    USER: "{{ dev_user }}"

- name: Ensure ~/.cargo directory exists
  ansible.builtin.file:
    path: "{{ cargo_home }}"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ dev_user }}"

- name: Configure Cargo linker for ARMv7hf
  ansible.builtin.copy:
    dest: "{{ cargo_home }}/config.toml"
    mode: "0644"
    content: |
      [target.armv7-unknown-linux-gnueabihf]
      linker = "arm-linux-gnueabihf-gcc"

      # Optional: speeds up iterative builds
      # [build]
      # rustc-wrapper = "ccache"
  become: true
  become_user: "{{ dev_user }}"

- name: Install clang / LLVM toolchain
  ansible.builtin.apt:
    name:
      - clang
      - clangd
      - llvm
      - lldb
      - lld
      - llvm-dev
      - libclang-dev
    state: present
    update_cache: true
